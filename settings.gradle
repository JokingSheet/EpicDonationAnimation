pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    // Fabric Loom adds its own remapped-mod repository during configuration.
    // PREFER_PROJECT permits that repository while retaining the settings repositories.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
}
rootProject.name = 'epic-donation-animation'
